name: Notebooks

on:
  push:
    branches: [main, convert-tutorials-to-pluto]
  pull_request:
  workflow_dispatch:

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pluto-notebooks:
    name: Pluto notebooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - uses: julia-actions/cache@v3

      - name: Install Pluto test runner dependency
        shell: bash
        run: |
          julia --color=yes --startup-file=no -e 'import Pkg; Pkg.add(name="Pluto", version="0.20")'

      - name: Audit embedded notebook manifests
        shell: bash
        run: |
          julia --color=yes --startup-file=no scripts/ci/audit_embedded_manifests.jl 0*.jl

      - name: Run all Pluto notebooks
        shell: bash
        env:
          JULIA_NUM_THREADS: '2'
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --color=yes --startup-file=no scripts/ci/run_pluto_notebooks.jl 0*.jl
